<!doctype html>
<html lang="en" data-theme="modern-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Storage Assistant — PegaProx</title>
<style>
:root{--bg:#080b0e;--surface:#161b22;--surface2:#0f1419;--hover:#1c2128;--border:#30363d;--text:#fff;--muted:#8b949e;--accent:#e57000;--accent-hover:#ff8c00;--ok:#3fb950;--warn:#d29922;--err:#f85149;--radius:10px;--shadow:0 12px 36px rgba(0,0,0,.28);--density:14px}
:root[data-theme="corporate-dark"]{--bg:#111a21;--surface:#243542;--surface2:#1b2a32;--hover:#29414e;--border:#344955;--text:#e9ecef;--muted:#728b9a;--accent:#49afd9;--accent-hover:#3d9bc2;--ok:#60b515;--warn:#efc006;--err:#f54f47;--radius:3px;--shadow:none;--density:10px}
:root[data-theme="corporate-light"]{--bg:#fafafa;--surface:#fff;--surface2:#f5f5f5;--hover:#eee;--border:#ccc;--text:#313131;--muted:#666;--accent:#0079b8;--accent-hover:#005e91;--ok:#4f950f;--warn:#9a7900;--err:#c33b35;--radius:3px;--shadow:none;--density:10px;color-scheme:light}
:root[data-theme="cloud-dark"]{--bg:#060f1e;--surface:#16304a;--surface2:#102338;--hover:#1d3b59;--border:#294965;--text:#e6f1f8;--muted:#8aa4b8;--accent:#22d3ee;--accent-hover:#67e8f9;--ok:#2dd4a7;--warn:#f5b945;--err:#f87171;--radius:14px;--shadow:0 4px 18px rgba(0,0,0,.2);--density:16px}
:root[data-theme="cloud-light"]{--bg:#eef1f6;--surface:#fff;--surface2:#f3f6fa;--hover:#e7edf4;--border:#cad5df;--text:#1b2732;--muted:#6a7a89;--accent:#0098c3;--accent-hover:#007ba0;--ok:#168365;--warn:#9b6d00;--err:#c84242;--radius:14px;--shadow:0 4px 16px rgba(50,70,90,.1);--density:16px;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{padding:var(--density) 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--surface2)}h1{font-size:19px;margin:0}h2{font-size:17px;margin:0}header p{margin:3px 0 0;color:var(--muted)}main{max-width:1200px;margin:auto;padding:20px}.notice{border:1px solid color-mix(in srgb,var(--warn) 55%,var(--border));background:color-mix(in srgb,var(--warn) 10%,var(--surface));color:var(--warn);border-radius:var(--radius);padding:10px 14px;margin-bottom:16px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:var(--density);box-shadow:var(--shadow)}.metric b{display:block;font-size:25px}.metric span{color:var(--muted)}.toolbar{display:flex;gap:9px;align-items:center;margin:18px 0 11px}.toolbar .spacer{flex:1}button,select,input,textarea{border-radius:calc(var(--radius) - 2px);border:1px solid var(--border);padding:8px 11px;background:var(--surface2);color:var(--text)}button{cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}button.danger{color:var(--err)}button:hover:not(:disabled){background:var(--hover)}button.primary:hover:not(:disabled){background:var(--accent-hover)}button:disabled{opacity:.45;cursor:not-allowed}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--border)}th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.035em}tbody tr:hover{background:var(--hover)}.pill{display:inline-block;border-radius:99px;padding:2px 8px;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}.pill.attention,.pill.partial,.pill.cancel_requested{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}.pill.cancelled{background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted)}.pill.failed{background:color-mix(in srgb,var(--err) 15%,transparent);color:var(--err)}.row-actions{white-space:nowrap}.row-actions button{padding:5px 8px;margin-left:4px}.empty{text-align:center;color:var(--muted);padding:38px}.hidden{display:none!important}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.68);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}.modal-backdrop.confirm-backdrop{z-index:70;background:rgba(0,0,0,.52)}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 22px 70px rgba(0,0,0,.45)}.modal.wide{width:min(920px,100%)}.modal.confirm-modal{width:min(500px,100%)}.modal-head,.modal-foot{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}.modal-foot{border-bottom:0;border-top:1px solid var(--border);justify-content:flex-end}.modal-body{padding:18px}.confirm-message{margin:0;color:var(--text)}.steps{display:flex;gap:8px;color:var(--muted);font-size:12px;margin-bottom:16px}.step{padding:4px 9px;border:1px solid var(--border);border-radius:99px}.step.active{border-color:var(--accent);color:var(--accent)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:600}.field input,.field select,.field textarea{width:100%}.field input[type="checkbox"]{width:auto}.checks{display:flex;flex-wrap:wrap;gap:12px}.checks label{display:flex;align-items:center;gap:6px;color:var(--text)}.checks input{width:auto}.hint{color:var(--muted);font-size:12px}.error{margin-top:12px;padding:9px 11px;border:1px solid color-mix(in srgb,var(--err) 55%,var(--border));background:color-mix(in srgb,var(--err) 10%,transparent);color:var(--err);border-radius:var(--radius)}.review{display:grid;gap:8px}.review-row{display:grid;grid-template-columns:180px 1fr;gap:12px;padding:7px 0;border-bottom:1px solid var(--border)}.review-row span:first-child{color:var(--muted)}.warning{color:var(--warn);font-weight:600}.toast{position:fixed;right:18px;bottom:18px;padding:11px 15px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);z-index:80}.toast.ok{border-color:var(--ok);color:var(--ok)}.toast.err{border-color:var(--err);color:var(--err)}
.progress-track{height:10px;background:var(--surface2);border:1px solid var(--border);border-radius:99px;overflow:hidden;margin:12px 0}.progress-bar{height:100%;width:0;background:var(--accent);transition:width .25s ease}.progress-bar.cancelled{background:var(--muted)}.result-section{margin-top:18px}.result-section h3{font-size:14px;margin:0 0 8px}.result-table td:first-child{color:var(--muted);width:42%}.compact-table th,.compact-table td{padding:7px}.limitations{margin:8px 0 0;padding-left:20px;color:var(--muted)}
@media(max-width:720px){.metrics,.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar{flex-wrap:wrap}.review-row{grid-template-columns:1fr}.modal-backdrop{padding:5px}.row-actions button{margin:3px 0 3px 3px}}
</style>
</head>
<body>
<header><div><h1 data-i18n="app.title">Storage Assistant</h1><p data-i18n="app.subtitle"></p></div></header>
<main>
  <div class="notice" data-i18n="status.discovery"></div>
  <section class="metrics"><div class="card metric"><b id="metric-all">–</b><span data-i18n="metric.all"></span></div><div class="card metric"><b id="metric-nfs">–</b><span data-i18n="metric.nfs"></span></div><div class="card metric"><b id="metric-iscsi">–</b><span data-i18n="metric.iscsi"></span></div></section>
  <div class="toolbar"><button id="add-nfs" class="primary" data-i18n="action.add_nfs"></button><button id="add-iscsi" class="primary" data-i18n="action.add_iscsi"></button><span class="spacer"></span><button id="refresh" data-i18n="action.refresh"></button></div>
  <section class="card table-wrap"><table><thead><tr><th data-i18n="table.name"></th><th data-i18n="table.location"></th><th data-i18n="table.host"></th><th data-i18n="table.type"></th><th data-i18n="table.target"></th><th data-i18n="table.state"></th><th data-i18n="table.actions"></th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" data-i18n="empty.resources"></div></section>
</main>

<div id="wizard" class="modal-backdrop hidden" role="dialog" aria-modal="true"><div class="modal">
  <div class="modal-head"><div><strong id="wizard-title"></strong><div class="hint" data-i18n="wizard.note"></div></div><button id="wizard-x" aria-label="Close" data-i18n-aria="action.close">×</button></div>
  <div class="modal-body"><div class="steps"><span id="step-definition" class="step active" data-i18n="wizard.step.definition"></span><span id="step-review" class="step" data-i18n="wizard.step.review"></span></div>
  <form id="resource-form"><input type="hidden" name="id"><input type="hidden" name="type"><div class="grid">
    <div class="field"><label data-i18n="field.name"></label><input name="name" required placeholder="nas-tech"></div><div class="field"><label data-i18n="field.location"></label><input name="location" required placeholder="hq"></div><div class="field"><label data-i18n="field.host"></label><input name="host" required placeholder="192.168.220.20"></div>
    <div class="field nfs"><label data-i18n="field.cluster"></label><input name="cluster_id" required placeholder="pve-prod"></div><div class="field nfs full"><label data-i18n="field.export"></label><input name="export" required placeholder="pve/technical"><span class="hint" data-i18n="field.export_hint"></span></div><div class="field nfs"><label data-i18n="field.nfs_version"></label><select name="nfs_version"><option>4.2</option><option>4.1</option><option>4</option><option>3</option></select></div><div class="field nfs full"><label data-i18n="field.content"></label><div class="checks"><label><input type="checkbox" name="content" value="iso" checked>ISO</label><label><input type="checkbox" name="content" value="vztmpl" checked>vztmpl</label><label><input type="checkbox" name="content" value="snippets" checked>snippets</label><label><input type="checkbox" name="content" value="import" checked>import</label></div></div><div class="field nfs full"><label data-i18n="field.nodes"></label><input name="nodes" placeholder="pve01, pve02"><span class="hint" data-i18n="field.nodes_hint"></span></div>
    <div class="field iscsi"><label data-i18n="field.pbs"></label><input name="pbs_id" required placeholder="pbs01"></div><div class="field iscsi"><label data-i18n="field.port"></label><input name="port" type="number" value="3260" min="1" max="65535" required></div><div class="field iscsi full"><label data-i18n="field.target_iqn"></label><input name="target_iqn" required placeholder="iqn.2026-08.example:nas.pbs"></div><div class="field iscsi"><label data-i18n="field.lun"></label><input name="lun" type="number" value="0" min="0" required></div><div class="field iscsi"><label data-i18n="field.wwid"></label><input name="wwid" placeholder="3600..."></div><div class="field iscsi"><label data-i18n="field.filesystem"></label><select name="filesystem"><option>xfs</option><option>ext4</option></select></div><div class="field iscsi"><label data-i18n="field.filesystem_mode"></label><select name="filesystem_mode"><option value="reuse" data-i18n="filesystem.reuse"></option><option value="create" data-i18n="filesystem.create"></option></select></div><div class="field iscsi"><label data-i18n="field.datastore"></label><input name="datastore" required placeholder="nas-backup"></div><div class="field iscsi"><label><input name="multipath" type="checkbox"> <span data-i18n="field.multipath"></span></label></div><div class="field iscsi full"><label data-i18n="field.portals"></label><input name="portals" placeholder="10.220.0.20:3260, 10.221.0.20:3260"><span class="hint" data-i18n="field.portals_hint"></span></div><div class="field full"><label data-i18n="field.description"></label><textarea name="description" rows="2"></textarea></div>
  </div></form><div id="review" class="review hidden"></div><div id="form-error" class="error hidden"></div></div>
  <div class="modal-foot"><button id="wizard-cancel" data-i18n="action.cancel"></button><button id="wizard-back" class="hidden" data-i18n="action.back"></button><button id="wizard-next" class="primary" data-i18n="action.review"></button><button id="wizard-save" class="primary hidden" data-i18n="action.save_definition"></button></div>
</div></div>

<div id="discovery-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true"><div class="modal wide">
  <div class="modal-head"><div><h2 data-i18n="discovery.title"></h2><div class="hint" data-i18n="discovery.note"></div></div><button id="discovery-x" aria-label="Close" data-i18n-aria="action.close">×</button></div>
  <div class="modal-body"><div id="discovery-state"></div><div class="progress-track"><div id="discovery-progress" class="progress-bar"></div></div><div id="discovery-phase" class="hint"></div><div id="discovery-error" class="error hidden"></div><div id="discovery-result" class="hidden"></div></div>
  <div class="modal-foot"><button id="discovery-cancel" class="danger" data-i18n="action.cancel_discovery"></button><button id="discovery-close" data-i18n="action.close"></button></div>
</div></div>
<div id="confirm-modal" class="modal-backdrop confirm-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message"><div class="modal confirm-modal">
  <div class="modal-head"><h2 id="confirm-title"></h2><button id="confirm-x" aria-label="Close" data-i18n-aria="action.close">×</button></div>
  <div class="modal-body"><p id="confirm-message" class="confirm-message"></p></div>
  <div class="modal-foot"><button id="confirm-dismiss"></button><button id="confirm-accept" class="danger"></button></div>
</div></div>
<div id="toast" class="toast hidden"></div>

<script>
'use strict';
const API='/api/plugins/storage-assistant/api';
let tr={},english={},registry=[],canManage=false,canDiscoverPve=false,canDiscoverPbs=false;
let currentPlan=null,reviewedResource=null,editingResourceId=null,currentTask=null,pollTimer=null,pollingPaused=false;
let taskEventSource=null,taskEventGeneration=0,taskEventConnected=false;
let confirmationResolver=null,confirmationReturnFocus=null,confirmationSpec=null,currentLanguage='en';
let pluginSettings={default_language:'auto',theme_override:'auto'};
const $=id=>document.getElementById(id),form=$('resource-form');
function esc(value){const node=document.createElement('div');node.textContent=value??'';return node.innerHTML}
function t(key){return tr[key]??english[key]??key}
function detectTheme(){const override=pluginSettings.theme_override;if(override&&override!=='auto')return override;const q=new URLSearchParams(location.search).get('theme');if(q==='corp-dark'||q==='corporate-dark')return'corporate-dark';if(q==='corp-light'||q==='corporate-light')return'corporate-light';if(q==='modern-dark')return'modern-dark';if(q==='cloud-dark'||q==='cloud-light')return q;try{if(parent!==window){const body=parent.document.body;if(body.dataset.layout==='cloud')return body.dataset.cloudTheme==='light'?'cloud-light':'cloud-dark';if(body.dataset.layout==='corporate'||body.dataset.corpTheme)return body.dataset.corpTheme==='light'?'corporate-light':'corporate-dark'}}catch(_error){}return'modern-dark'}
function applyTheme(){document.documentElement.dataset.theme=detectTheme()}
try{if(parent!==window)new MutationObserver(applyTheme).observe(parent.document.body,{attributes:true,attributeFilter:['data-layout','data-cloud-theme','data-corp-theme']})}catch(_error){}
async function api(path,options={}){const response=await fetch(`${API}/${path}`,{credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest',...(options.headers||{})},...options});let data={};try{data=await response.json()}catch(_error){}if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);return data}
function paintConfirmation(){if(!confirmationSpec)return;$('confirm-title').textContent=t(confirmationSpec.titleKey);$('confirm-message').textContent=t(confirmationSpec.messageKey);$('confirm-dismiss').textContent=t(confirmationSpec.dismissKey);$('confirm-accept').textContent=t(confirmationSpec.acceptKey)}
function paint(){document.querySelectorAll('[data-i18n]').forEach(element=>element.textContent=t(element.dataset.i18n));document.querySelectorAll('[data-i18n-aria]').forEach(element=>element.setAttribute('aria-label',t(element.dataset.i18nAria)));document.documentElement.lang=currentLanguage;paintConfirmation()}
function normalizeLanguage(value){const base=String(value||'').trim().toLowerCase().split(/[-_]/)[0];return base==='pl'?'pl':'en'}
function storedPegaproxLanguage(){try{return localStorage.getItem('pegaprox-language')||''}catch(_error){return''}}
async function detectSystemLanguage(){const stored=storedPegaproxLanguage();if(stored)return normalizeLanguage(stored);try{const response=await fetch('/api/user/preferences',{credentials:'same-origin',headers:{'X-Requested-With':'XMLHttpRequest'}});if(response.ok){const preferences=await response.json();if(preferences.language)return normalizeLanguage(preferences.language)}}catch(_error){}const configured=pluginSettings.default_language&&pluginSettings.default_language!=='auto'?pluginSettings.default_language:'';return normalizeLanguage(configured||navigator.language||'en')}
async function setLanguage(lang){const normalized=normalizeLanguage(lang);if(normalized===currentLanguage&&Object.keys(english).length){paint();return}english=await api('locale?lang=en');tr=normalized==='en'?english:await api(`locale?lang=${encodeURIComponent(normalized)}`);currentLanguage=normalized;paint();renderRows();if(currentTask)renderTask(currentTask)}
function notify(message,kind='ok'){const element=$('toast');element.textContent=message;element.className=`toast ${kind}`;setTimeout(()=>element.className='toast hidden',3000)}
function askConfirmation(titleKey,messageKey,dismissKey,acceptKey){return new Promise(resolve=>{if(confirmationResolver)confirmationResolver(false);confirmationResolver=resolve;confirmationReturnFocus=document.activeElement;confirmationSpec={titleKey,messageKey,dismissKey,acceptKey};paintConfirmation();$('confirm-modal').classList.remove('hidden');$('confirm-dismiss').focus()})}
function resolveConfirmation(accepted){if(!confirmationResolver)return;const resolve=confirmationResolver;confirmationResolver=null;confirmationSpec=null;$('confirm-modal').classList.add('hidden');resolve(accepted);if(confirmationReturnFocus?.isConnected)confirmationReturnFocus.focus();confirmationReturnFocus=null}
function splitList(value){return String(value||'').split(',').map(item=>item.trim()).filter(Boolean)}
function payload(){const data=new FormData(form),kind=data.get('type');const base={id:data.get('id')||undefined,type:kind,name:data.get('name'),location:data.get('location'),host:data.get('host'),description:data.get('description')};if(kind==='pve_nfs')return{...base,cluster_id:data.get('cluster_id'),export:data.get('export'),nfs_version:data.get('nfs_version'),content:data.getAll('content'),nodes:splitList(data.get('nodes'))};return{...base,pbs_id:data.get('pbs_id'),port:Number(data.get('port')),target_iqn:data.get('target_iqn'),lun:Number(data.get('lun')),wwid:data.get('wwid'),filesystem:data.get('filesystem'),filesystem_mode:data.get('filesystem_mode'),datastore:data.get('datastore'),multipath:data.get('multipath')==='on',portals:splitList(data.get('portals'))}}
function fill(resource){form.reset();form.elements.id.value='';for(const[key,value]of Object.entries(resource||{})){if(key==='content'){form.querySelectorAll('[name="content"]').forEach(item=>item.checked=value.includes(item.value));continue}const element=form.elements.namedItem(key);if(!element)continue;if(element.type==='checkbox')element.checked=Boolean(value);else if(Array.isArray(value))element.value=value.join(', ');else element.value=value??''}}
function setKind(kind){form.elements.type.value=kind;document.querySelectorAll('.nfs').forEach(section=>{const hidden=kind!=='pve_nfs';section.classList.toggle('hidden',hidden);section.querySelectorAll('input,select,textarea').forEach(field=>field.disabled=hidden)});document.querySelectorAll('.iscsi').forEach(section=>{const hidden=kind!=='pbs_iscsi';section.classList.toggle('hidden',hidden);section.querySelectorAll('input,select,textarea').forEach(field=>field.disabled=hidden)});$('wizard-title').textContent=t(kind==='pve_nfs'?'wizard.nfs.title':'wizard.iscsi.title')}
function showDefinition(){form.classList.remove('hidden');$('review').classList.add('hidden');$('step-definition').classList.add('active');$('step-review').classList.remove('active');$('wizard-back').classList.add('hidden');$('wizard-next').classList.remove('hidden');$('wizard-save').classList.add('hidden');$('form-error').classList.add('hidden')}
function openWizard(kind,resource=null){currentPlan=null;reviewedResource=null;editingResourceId=resource?.id||null;fill(resource||{type:kind,nfs_version:'4.2',port:3260,lun:0,filesystem:'xfs',filesystem_mode:'reuse',cluster_id:new URLSearchParams(location.search).get('cluster')||''});setKind(kind);showDefinition();$('wizard').classList.remove('hidden')}
function closeWizard(){$('wizard').classList.add('hidden');currentPlan=null;reviewedResource=null;editingResourceId=null}
function showError(error){$('form-error').textContent=t(error.message||String(error));$('form-error').classList.remove('hidden')}
function reviewRow(label,value){return`<div class="review-row"><span>${esc(label)}</span><span>${esc(value)}</span></div>`}
function primaryPortal(resource){const host=String(resource.host||'');return`${host.includes(':')?`[${host}]`:host}:${resource.port}`}
function renderReview(resource,plan){const rows=[reviewRow(t('table.type'),t(`type.${resource.type}`)),reviewRow(t('table.name'),resource.name),reviewRow(t('field.location'),resource.location),reviewRow(t('field.host'),resource.host)];if(resource.type==='pve_nfs'){rows.push(reviewRow(t('field.cluster'),resource.cluster_id),reviewRow(t('field.export'),resource.export),reviewRow(t('field.nfs_version'),resource.nfs_version),reviewRow(t('field.content'),(resource.content||[]).join(', ')),reviewRow(t('field.nodes'),(resource.nodes||[]).length?resource.nodes.join(', '):t('value.all_cluster_nodes')))}else{rows.push(reviewRow(t('field.pbs'),resource.pbs_id),reviewRow(t('review.primary_portal'),primaryPortal(resource)),reviewRow(t('field.target_iqn'),resource.target_iqn),reviewRow(t('field.lun'),resource.lun),reviewRow(t('field.wwid'),resource.wwid||t('value.not_provided')),reviewRow(t('field.filesystem'),resource.filesystem),reviewRow(t('field.filesystem_mode'),t(`filesystem.${resource.filesystem_mode}`)),reviewRow(t('field.datastore'),resource.datastore),reviewRow(t('field.multipath'),resource.multipath?t('value.yes'):t('value.no')),reviewRow(t('field.portals'),(resource.portals||[]).length?resource.portals.join(', '):t('value.none')))}rows.push(reviewRow(t('field.description'),resource.description||t('value.none')));const actions=(plan.actions||[]).map(item=>`<li>${esc(t(`plan.${item}`))}</li>`).join('');const safetyKey=plan.destructive?'plan.destructive':resource.type==='pve_nfs'?'plan.nondestructive.nfs':'plan.nondestructive.iscsi';const safety=plan.destructive?`<span class="warning">${esc(t(safetyKey))}</span>`:esc(t(safetyKey));$('review').innerHTML=`${rows.join('')}<div class="review-row"><span>${esc(t('review.operations'))}</span><ul>${actions}</ul></div><div class="review-row"><span>${esc(t('review.safety'))}</span><span>${safety}</span></div>${(plan.blockers||[]).length?`<div class="error">${plan.blockers.map(item=>esc(t(item))).join('<br>')}</div>`:''}`;$('form-error').textContent='';$('form-error').classList.add('hidden');$('review').classList.remove('hidden');form.classList.add('hidden');$('step-definition').classList.remove('active');$('step-review').classList.add('active');$('wizard-next').classList.add('hidden');$('wizard-back').classList.remove('hidden');$('wizard-save').classList.remove('hidden')}
async function review(){try{if(!form.reportValidity())return;const resource=payload();currentPlan=await api('plan',{method:'POST',body:JSON.stringify(resource)});reviewedResource=currentPlan.resource||resource;renderReview(reviewedResource,currentPlan)}catch(error){showError(error)}}
async function saveDefinition(){try{if(!reviewedResource)throw new Error('resource.invalid');const method=editingResourceId?'PUT':'POST';await api('resources',{method,body:JSON.stringify(reviewedResource)});notify(t('message.saved'));closeWizard();await load()}catch(error){showError(error)}}
async function removeResource(id){if(!await askConfirmation('confirm.delete.title','confirm.delete','action.keep_definition','action.confirm_delete'))return;try{await api(`resources?id=${encodeURIComponent(id)}`,{method:'DELETE'});notify(t('message.deleted'));await load()}catch(error){notify(t(error.message),'err')}}
function boolValue(value){return value?t('value.yes'):t('value.no')}
function summaryRows(summary){return Object.entries(summary||{}).map(([key,value])=>{const rendered=Array.isArray(value)?(value.length?value.join(', '):t('value.none')):typeof value==='boolean'?boolValue(value):value;return`<tr><td>${esc(t(`discovery.summary.${key}`))}</td><td>${esc(rendered)}</td></tr>`}).join('')}
function renderPveResult(result){const nodeRows=(result.nodes||[]).map(node=>`<tr><td>${esc(node.node)}</td><td>${esc(t(`discovery.node_state.${node.state}`))}</td><td>${esc(boolValue(node.export_visible))}</td><td>${esc(node.exports_seen??t('value.none'))}</td></tr>`).join('');return`<section class="result-section"><h3>${esc(t('discovery.summary'))}</h3><table class="result-table">${summaryRows(result.summary)}</table></section><section class="result-section"><h3>${esc(t('discovery.nodes'))}</h3><div class="table-wrap"><table class="compact-table"><thead><tr><th>${esc(t('discovery.node'))}</th><th>${esc(t('table.state'))}</th><th>${esc(t('discovery.export_visible'))}</th><th>${esc(t('discovery.exports_seen'))}</th></tr></thead><tbody>${nodeRows}</tbody></table></div></section>`}
function renderPbsResult(result){const deviceRows=(result.devices||[]).map(device=>`<tr><td>${esc(device.path||device.name)}</td><td>${esc(device.filesystem||t('value.none'))}</td><td>${esc(boolValue(device.wwid_match))}</td><td>${esc(boolValue(device.mounted))}</td></tr>`).join('');const capabilities=Object.entries(result.capabilities||{}).map(([key,value])=>`<tr><td>${esc(t(`discovery.capability.${key}`))}</td><td>${esc(boolValue(value))}</td></tr>`).join('');return`<section class="result-section"><h3>${esc(t('discovery.summary'))}</h3><table class="result-table">${summaryRows(result.summary)}</table></section><section class="result-section"><h3>${esc(t('discovery.capabilities'))}</h3><table class="result-table">${capabilities}</table></section>${deviceRows?`<section class="result-section"><h3>${esc(t('discovery.devices'))}</h3><div class="table-wrap"><table class="compact-table"><thead><tr><th>${esc(t('discovery.device'))}</th><th>${esc(t('field.filesystem'))}</th><th>${esc(t('discovery.wwid_match'))}</th><th>${esc(t('discovery.mounted'))}</th></tr></thead><tbody>${deviceRows}</tbody></table></div></section>`:''}`}
function renderTask(task){currentTask=task;const active=['queued','running','cancel_requested'].includes(task.state);if(!active){stopTaskEvents();if(confirmationSpec?.titleKey==='confirm.cancel_discovery.title')resolveConfirmation(false)}$('discovery-progress').style.width=`${task.progress||0}%`;$('discovery-progress').classList.toggle('cancelled',task.state==='cancelled');$('discovery-phase').textContent=t(task.phase||'discovery.phase.queued');const stateClass=task.result?.status||task.state||'';$('discovery-state').innerHTML=`<span class="pill ${esc(stateClass)}">${esc(t(`discovery.task_state.${task.state}`))}</span>`;$('discovery-cancel').disabled=!task.id||!['queued','running'].includes(task.state);const showError=Boolean(task.error)&&task.state!=='cancelled';$('discovery-error').classList.toggle('hidden',!showError);$('discovery-error').textContent=showError?t(task.error):'';const result=$('discovery-result');if(task.state==='succeeded'&&task.result){const body=task.result.kind==='pve_nfs'?renderPveResult(task.result):renderPbsResult(task.result);const limits=(task.result.limitations||[]).map(item=>`<li>${esc(t(item))}</li>`).join('');result.innerHTML=`${body}<section class="result-section"><h3>${esc(t('discovery.limitations'))}</h3><ul class="limitations">${limits}</ul></section>`;result.classList.remove('hidden')}else{result.textContent='';result.classList.add('hidden')}}
function renderCancelledByUser(task){pollingPaused=true;stopPolling();stopTaskEvents();renderTask({...task,state:'cancelled',phase:'discovery.phase.cancelled',progress:100,result:null,error:null})}
function stopPolling(){if(pollTimer){clearTimeout(pollTimer);pollTimer=null}}
function stopTaskEvents(){taskEventGeneration+=1;taskEventConnected=false;if(taskEventSource){taskEventSource.close();taskEventSource=null}}
async function startTaskEvents(task){stopTaskEvents();if(task.resource_type!=='pve_nfs'||!task.target_id)return;const generation=taskEventGeneration;try{const tokenResponse=await fetch('/api/sse/token',{method:'POST',credentials:'same-origin',headers:{'X-Requested-With':'XMLHttpRequest'}});if(!tokenResponse.ok)return;const tokenData=await tokenResponse.json();if(generation!==taskEventGeneration||!tokenData.token||currentTask?.id!==task.id)return;const url=`/api/sse/updates?token=${encodeURIComponent(tokenData.token)}&clusters=${encodeURIComponent(task.target_id)}`;const source=new EventSource(url,{withCredentials:true});taskEventSource=source;source.onopen=()=>{if(generation===taskEventGeneration&&taskEventSource===source)taskEventConnected=true};source.onmessage=event=>{if(generation!==taskEventGeneration||pollingPaused||currentTask?.id!==task.id)return;try{const message=JSON.parse(event.data);if(message.type!=='storage_assistant_discovery'||message.data?.task_id!==task.id)return;stopPolling();pollTimer=setTimeout(pollTask,0)}catch(_error){}};source.onerror=()=>{if(generation!==taskEventGeneration||taskEventSource!==source)return;source.close();taskEventSource=null;taskEventConnected=false;if(!pollingPaused&&currentTask?.id===task.id){stopPolling();pollTimer=setTimeout(pollTask,0)}}}catch(_error){taskEventConnected=false}}
async function pollTask(){if(pollingPaused||!currentTask)return;try{const task=await api(`discovery?id=${encodeURIComponent(currentTask.id)}`);if(pollingPaused)return;renderTask(task);if(['queued','running','cancel_requested'].includes(task.state))pollTimer=setTimeout(pollTask,taskEventConnected?5000:750)}catch(error){if(pollingPaused)return;$('discovery-error').textContent=t(error.message);$('discovery-error').classList.remove('hidden')}}
async function startDiscovery(resource){stopPolling();stopTaskEvents();pollingPaused=false;currentTask=null;$('discovery-result').classList.add('hidden');$('discovery-error').classList.add('hidden');$('discovery-modal').classList.remove('hidden');renderTask({state:'queued',phase:'discovery.phase.queued',progress:0});try{const task=await api('discovery',{method:'POST',body:JSON.stringify({resource_id:resource.id})});renderTask(task);startTaskEvents(task);notify(t('message.discovery_started'));pollTimer=setTimeout(pollTask,250)}catch(error){renderTask({state:'failed',phase:'discovery.phase.failed',progress:0,error:error.message})}}
async function cancelDiscovery(){if(!currentTask||!['queued','running'].includes(currentTask.state))return;const taskId=currentTask.id;pollingPaused=true;stopPolling();const accepted=await askConfirmation('confirm.cancel_discovery.title','confirm.cancel_discovery','action.continue_discovery','action.confirm_cancel_discovery');if(!accepted){pollingPaused=false;if(currentTask?.id===taskId)pollTimer=setTimeout(pollTask,0);return}try{const task=await api(`discovery?id=${encodeURIComponent(taskId)}`,{method:'DELETE'});renderCancelledByUser(task)}catch(error){pollingPaused=false;$('discovery-error').textContent=t(error.message);$('discovery-error').classList.remove('hidden');if(currentTask?.id===taskId)pollTimer=setTimeout(pollTask,750)}}
function closeDiscovery(){pollingPaused=true;stopPolling();stopTaskEvents();$('discovery-modal').classList.add('hidden');currentTask=null}
function renderRows(){const body=$('rows');body.textContent='';for(const item of registry){const target=item.type==='pve_nfs'?item.export:`${item.target_iqn} / LUN ${item.lun}`;const allowed=item.type==='pve_nfs'?canDiscoverPve:canDiscoverPbs;const row=document.createElement('tr');row.innerHTML=`<td>${esc(item.name)}</td><td>${esc(item.location)}</td><td>${esc(item.host)}</td><td>${esc(t(`type.${item.type}`))}</td><td>${esc(target)}</td><td><span class="pill">${esc(t('state.configured'))}</span></td><td class="row-actions"><button data-discover="${esc(item.id)}" ${allowed?'':'disabled'}>${esc(t('action.discover'))}</button><button data-edit="${esc(item.id)}">${esc(t('action.edit'))}</button><button class="danger" data-delete="${esc(item.id)}">${esc(t('action.delete'))}</button></td>`;body.appendChild(row)}body.querySelectorAll('[data-discover]').forEach(button=>button.onclick=()=>{const item=registry.find(resource=>resource.id===button.dataset.discover);startDiscovery(item)});body.querySelectorAll('[data-edit]').forEach(button=>{button.disabled=!canManage;button.onclick=()=>{const item=registry.find(resource=>resource.id===button.dataset.edit);openWizard(item.type,item)}});body.querySelectorAll('[data-delete]').forEach(button=>{button.disabled=!canManage;button.onclick=()=>removeResource(button.dataset.delete)});$('empty').hidden=registry.length>0}
async function load(){try{const[status,data]=await Promise.all([api('status'),api('resources')]);canManage=Boolean(status.can_manage);canDiscoverPve=Boolean(status.can_discover_pve);canDiscoverPbs=Boolean(status.can_discover_pbs);registry=data.resources||[];$('metric-all').textContent=status.resources;$('metric-nfs').textContent=status.pve_nfs;$('metric-iscsi').textContent=status.pbs_iscsi;$('add-nfs').disabled=!canManage;$('add-iscsi').disabled=!canManage;renderRows()}catch(error){$('empty').hidden=false;$('empty').textContent=t(error.message||'error.load')}}
$('refresh').onclick=load;$('add-nfs').onclick=()=>openWizard('pve_nfs');$('add-iscsi').onclick=()=>openWizard('pbs_iscsi');
$('wizard-x').onclick=closeWizard;$('wizard-cancel').onclick=closeWizard;$('wizard-back').onclick=showDefinition;$('wizard-next').onclick=review;$('wizard-save').onclick=saveDefinition;$('wizard').onclick=event=>{if(event.target===$('wizard'))closeWizard()};
$('discovery-x').onclick=closeDiscovery;$('discovery-close').onclick=closeDiscovery;$('discovery-cancel').onclick=cancelDiscovery;$('discovery-modal').onclick=event=>{if(event.target===$('discovery-modal'))closeDiscovery()};
$('confirm-x').onclick=()=>resolveConfirmation(false);$('confirm-dismiss').onclick=()=>resolveConfirmation(false);$('confirm-accept').onclick=()=>resolveConfirmation(true);$('confirm-modal').onclick=event=>{if(event.target===$('confirm-modal'))resolveConfirmation(false)};
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(!$('confirm-modal').classList.contains('hidden'))resolveConfirmation(false);else if(!$('discovery-modal').classList.contains('hidden'))closeDiscovery();else closeWizard()}});
window.addEventListener('storage',event=>{if(event.key==='pegaprox-language'&&event.newValue)setLanguage(event.newValue).catch(error=>notify(String(error),'err'))});
async function bootstrap(){try{pluginSettings=await api('settings')}catch(_error){}applyTheme();await setLanguage(await detectSystemLanguage());await load()}
bootstrap().catch(error=>notify(String(error),'err'));
</script>
