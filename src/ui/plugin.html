<!doctype html>
<html lang="en" data-theme="modern-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Storage Assistant — PegaProx</title>
<style>
:root{--bg:#080b0e;--surface:#161b22;--surface2:#0f1419;--hover:#1c2128;--border:#30363d;--text:#fff;--muted:#8b949e;--accent:#e57000;--accent-hover:#ff8c00;--ok:#3fb950;--warn:#d29922;--err:#f85149;--radius:10px;--shadow:0 12px 36px rgba(0,0,0,.28);--density:14px}
:root[data-theme="corporate-dark"]{--bg:#111a21;--surface:#243542;--surface2:#1b2a32;--hover:#29414e;--border:#344955;--text:#e9ecef;--muted:#728b9a;--accent:#49afd9;--accent-hover:#3d9bc2;--ok:#60b515;--warn:#efc006;--err:#f54f47;--radius:3px;--shadow:none;--density:10px}
:root[data-theme="corporate-light"]{--bg:#fafafa;--surface:#fff;--surface2:#f5f5f5;--hover:#eee;--border:#ccc;--text:#313131;--muted:#666;--accent:#0079b8;--accent-hover:#005e91;--ok:#4f950f;--warn:#9a7900;--err:#c33b35;--radius:3px;--shadow:none;--density:10px;color-scheme:light}
:root[data-theme="cloud-dark"]{--bg:#060f1e;--surface:#16304a;--surface2:#102338;--hover:#1d3b59;--border:#294965;--text:#e6f1f8;--muted:#8aa4b8;--accent:#22d3ee;--accent-hover:#67e8f9;--ok:#2dd4a7;--warn:#f5b945;--err:#f87171;--radius:14px;--shadow:0 4px 18px rgba(0,0,0,.2);--density:16px}
:root[data-theme="cloud-light"]{--bg:#eef1f6;--surface:#fff;--surface2:#f3f6fa;--hover:#e7edf4;--border:#cad5df;--text:#1b2732;--muted:#6a7a89;--accent:#0098c3;--accent-hover:#007ba0;--ok:#168365;--warn:#9b6d00;--err:#c84242;--radius:14px;--shadow:0 4px 16px rgba(50,70,90,.1);--density:16px;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{padding:var(--density) 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--surface2)}h1{font-size:19px;margin:0}header p{margin:3px 0 0;color:var(--muted)}main{max-width:1200px;margin:auto;padding:20px}.notice{border:1px solid color-mix(in srgb,var(--warn) 55%,var(--border));background:color-mix(in srgb,var(--warn) 10%,var(--surface));color:var(--warn);border-radius:var(--radius);padding:10px 14px;margin-bottom:16px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:var(--density);box-shadow:var(--shadow)}.metric b{display:block;font-size:25px}.metric span{color:var(--muted)}.toolbar{display:flex;gap:9px;align-items:center;margin:18px 0 11px}.toolbar .spacer{flex:1}button,select,input,textarea{border-radius:calc(var(--radius) - 2px);border:1px solid var(--border);padding:8px 11px;background:var(--surface2);color:var(--text)}button{cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}button.danger{color:var(--err)}button:hover:not(:disabled){background:var(--hover)}button.primary:hover:not(:disabled){background:var(--accent-hover)}button:disabled{opacity:.45;cursor:not-allowed}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--border)}th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.035em}tbody tr:hover{background:var(--hover)}.pill{display:inline-block;border-radius:99px;padding:2px 8px;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}.row-actions{white-space:nowrap}.row-actions button{padding:5px 8px;margin-left:4px}.empty{text-align:center;color:var(--muted);padding:38px}.hidden{display:none!important}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.68);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 22px 70px rgba(0,0,0,.45)}.modal-head,.modal-foot{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}.modal-foot{border-bottom:0;border-top:1px solid var(--border);justify-content:flex-end}.modal-body{padding:18px}.steps{display:flex;gap:8px;color:var(--muted);font-size:12px;margin-bottom:16px}.step{padding:4px 9px;border:1px solid var(--border);border-radius:99px}.step.active{border-color:var(--accent);color:var(--accent)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:600}.field input,.field select,.field textarea{width:100%}.field input[type="checkbox"]{width:auto}.checks{display:flex;flex-wrap:wrap;gap:12px}.checks label{display:flex;align-items:center;gap:6px;color:var(--text)}.checks input{width:auto}.hint{color:var(--muted);font-size:12px}.error{margin-top:12px;padding:9px 11px;border:1px solid color-mix(in srgb,var(--err) 55%,var(--border));background:color-mix(in srgb,var(--err) 10%,transparent);color:var(--err);border-radius:var(--radius)}.review{display:grid;gap:8px}.review-row{display:grid;grid-template-columns:160px 1fr;gap:12px;padding:7px 0;border-bottom:1px solid var(--border)}.review-row span:first-child{color:var(--muted)}.warning{color:var(--warn);font-weight:600}.toast{position:fixed;right:18px;bottom:18px;padding:11px 15px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);z-index:80}.toast.ok{border-color:var(--ok);color:var(--ok)}.toast.err{border-color:var(--err);color:var(--err)}
@media(max-width:720px){.metrics,.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar{flex-wrap:wrap}.review-row{grid-template-columns:1fr}.modal-backdrop{padding:5px}}
</style>
</head>
<body>
<header><div><h1 data-i18n="app.title">Storage Assistant</h1><p data-i18n="app.subtitle"></p></div><select id="lang" aria-label="Language" data-i18n-aria="field.language"><option value="en">English</option><option value="pl">Polski</option></select></header>
<main><div class="notice" data-i18n="status.foundation"></div><section class="metrics"><div class="card metric"><b id="metric-all">–</b><span data-i18n="metric.all"></span></div><div class="card metric"><b id="metric-nfs">–</b><span data-i18n="metric.nfs"></span></div><div class="card metric"><b id="metric-iscsi">–</b><span data-i18n="metric.iscsi"></span></div></section><div class="toolbar"><button id="add-nfs" class="primary" data-i18n="action.add_nfs"></button><button id="add-iscsi" class="primary" data-i18n="action.add_iscsi"></button><span class="spacer"></span><button id="refresh" data-i18n="action.refresh"></button></div><section class="card table-wrap"><table><thead><tr><th data-i18n="table.name"></th><th data-i18n="table.location"></th><th data-i18n="table.host"></th><th data-i18n="table.type"></th><th data-i18n="table.target"></th><th data-i18n="table.state"></th><th data-i18n="table.actions"></th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" data-i18n="empty.resources"></div></section></main>
<div id="wizard" class="modal-backdrop hidden" role="dialog" aria-modal="true"><div class="modal"><div class="modal-head"><div><strong id="wizard-title"></strong><div class="hint" data-i18n="wizard.note"></div></div><button id="wizard-x" aria-label="Close" data-i18n-aria="action.close">×</button></div><div class="modal-body"><div class="steps"><span id="step-definition" class="step active" data-i18n="wizard.step.definition"></span><span id="step-review" class="step" data-i18n="wizard.step.review"></span></div>
<form id="resource-form"><input type="hidden" name="id"><input type="hidden" name="type"><div class="grid"><div class="field"><label data-i18n="field.name"></label><input name="name" required placeholder="nas-tech"></div><div class="field"><label data-i18n="field.location"></label><input name="location" required placeholder="hq"></div><div class="field"><label data-i18n="field.host"></label><input name="host" required placeholder="192.168.220.20"></div>
<div class="field nfs"><label data-i18n="field.cluster"></label><input name="cluster_id" required placeholder="pve-prod"></div><div class="field nfs full"><label data-i18n="field.export"></label><input name="export" required placeholder="/pve/technical"></div><div class="field nfs"><label data-i18n="field.nfs_version"></label><select name="nfs_version"><option>4.2</option><option>4.1</option><option>4</option><option>3</option></select></div><div class="field nfs full"><label data-i18n="field.content"></label><div class="checks"><label><input type="checkbox" name="content" value="iso" checked>ISO</label><label><input type="checkbox" name="content" value="vztmpl" checked>vztmpl</label><label><input type="checkbox" name="content" value="snippets" checked>snippets</label><label><input type="checkbox" name="content" value="import" checked>import</label></div></div><div class="field nfs full"><label data-i18n="field.nodes"></label><input name="nodes" placeholder="pve01, pve02"><span class="hint" data-i18n="field.nodes_hint"></span></div>
<div class="field iscsi"><label data-i18n="field.pbs"></label><input name="pbs_id" required placeholder="pbs01"></div><div class="field iscsi"><label data-i18n="field.port"></label><input name="port" type="number" value="3260" min="1" max="65535" required></div><div class="field iscsi full"><label data-i18n="field.target_iqn"></label><input name="target_iqn" required placeholder="iqn.2026-08.example:nas.pbs"></div><div class="field iscsi"><label data-i18n="field.lun"></label><input name="lun" type="number" value="0" min="0" required></div><div class="field iscsi"><label data-i18n="field.wwid"></label><input name="wwid" placeholder="3600..."></div><div class="field iscsi"><label data-i18n="field.filesystem"></label><select name="filesystem"><option>xfs</option><option>ext4</option></select></div><div class="field iscsi"><label data-i18n="field.filesystem_mode"></label><select name="filesystem_mode"><option value="reuse" data-i18n="filesystem.reuse"></option><option value="create" data-i18n="filesystem.create"></option></select></div><div class="field iscsi"><label data-i18n="field.datastore"></label><input name="datastore" required placeholder="nas-backup"></div><div class="field iscsi"><label><input name="multipath" type="checkbox"> <span data-i18n="field.multipath"></span></label></div><div class="field iscsi full"><label data-i18n="field.portals"></label><input name="portals" placeholder="10.220.0.20:3260, 10.221.0.20:3260"><span class="hint" data-i18n="field.portals_hint"></span></div><div class="field full"><label data-i18n="field.description"></label><textarea name="description" rows="2"></textarea></div></div></form>
<div id="review" class="review hidden"></div><div id="form-error" class="error hidden"></div></div><div class="modal-foot"><button id="wizard-cancel" data-i18n="action.cancel"></button><button id="wizard-back" class="hidden" data-i18n="action.back"></button><button id="wizard-next" class="primary" data-i18n="action.review"></button><button id="wizard-save" class="primary hidden" data-i18n="action.save_definition"></button></div></div></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const API='/api/plugins/storage-assistant/api';let tr={},english={},registry=[],canManage=false,currentPlan=null;const $=id=>document.getElementById(id);const form=$('resource-form');
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}function t(k){return tr[k]??english[k]??k}
function detectTheme(){const q=new URLSearchParams(location.search).get('theme');if(q==='corp-dark')return'corporate-dark';if(q==='corp-light')return'corporate-light';if(q==='modern-dark')return'modern-dark';if(q==='cloud-dark'||q==='cloud-light')return q;try{if(parent!==window&&parent.document.body.dataset.layout==='cloud')return parent.document.body.dataset.cloudTheme==='light'?'cloud-light':'cloud-dark'}catch(_e){}return'modern-dark'}function applyTheme(){document.documentElement.dataset.theme=detectTheme()}try{if(parent!==window)new MutationObserver(applyTheme).observe(parent.document.body,{attributes:true,attributeFilter:['data-layout','data-cloud-theme','data-corp-theme']})}catch(_e){}
async function api(path,options={}){const response=await fetch(`${API}/${path}`,{credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest',...(options.headers||{})},...options});let data={};try{data=await response.json()}catch(_e){}if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);return data}function paint(){document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));document.querySelectorAll('[data-i18n-aria]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.i18nAria)));document.documentElement.lang=$('lang').value}async function setLanguage(lang){localStorage.setItem('storage-assistant.lang',lang);english=await api('locale?lang=en');tr=lang==='en'?english:await api(`locale?lang=${encodeURIComponent(lang)}`);paint()}function notify(message,kind='ok'){const el=$('toast');el.textContent=message;el.className=`toast ${kind}`;setTimeout(()=>el.className='toast hidden',2600)}function splitList(v){return String(v||'').split(',').map(x=>x.trim()).filter(Boolean)}
function payload(){const fd=new FormData(form),kind=fd.get('type');const base={id:fd.get('id')||undefined,type:kind,name:fd.get('name'),location:fd.get('location'),host:fd.get('host'),description:fd.get('description')};if(kind==='pve_nfs')return{...base,cluster_id:fd.get('cluster_id'),export:fd.get('export'),nfs_version:fd.get('nfs_version'),content:fd.getAll('content'),nodes:splitList(fd.get('nodes'))};return{...base,pbs_id:fd.get('pbs_id'),port:Number(fd.get('port')),target_iqn:fd.get('target_iqn'),lun:Number(fd.get('lun')),wwid:fd.get('wwid'),filesystem:fd.get('filesystem'),filesystem_mode:fd.get('filesystem_mode'),datastore:fd.get('datastore'),multipath:fd.get('multipath')==='on',portals:splitList(fd.get('portals'))}}
function fill(resource){form.reset();for(const[key,value]of Object.entries(resource||{})){if(key==='content'){form.querySelectorAll('[name="content"]').forEach(x=>x.checked=value.includes(x.value));continue}const el=form.elements.namedItem(key);if(!el)continue;if(el.type==='checkbox')el.checked=Boolean(value);else if(Array.isArray(value))el.value=value.join(', ');else el.value=value??''}}function setKind(kind){form.elements.type.value=kind;document.querySelectorAll('.nfs').forEach(x=>{const hidden=kind!=='pve_nfs';x.classList.toggle('hidden',hidden);x.querySelectorAll('input,select,textarea').forEach(field=>field.disabled=hidden)});document.querySelectorAll('.iscsi').forEach(x=>{const hidden=kind!=='pbs_iscsi';x.classList.toggle('hidden',hidden);x.querySelectorAll('input,select,textarea').forEach(field=>field.disabled=hidden)});$('wizard-title').textContent=t(kind==='pve_nfs'?'wizard.nfs.title':'wizard.iscsi.title')}
function showDefinition(){form.classList.remove('hidden');$('review').classList.add('hidden');$('step-definition').classList.add('active');$('step-review').classList.remove('active');$('wizard-back').classList.add('hidden');$('wizard-next').classList.remove('hidden');$('wizard-save').classList.add('hidden');$('form-error').classList.add('hidden')}function openWizard(kind,resource=null){fill(resource||{type:kind,nfs_version:'4.2',port:3260,lun:0,filesystem:'xfs',filesystem_mode:'reuse',cluster_id:new URLSearchParams(location.search).get('cluster')||''});setKind(kind);showDefinition();$('wizard').classList.remove('hidden')}function closeWizard(){$('wizard').classList.add('hidden');currentPlan=null}function showError(error){$('form-error').textContent=t(error.message||String(error));$('form-error').classList.remove('hidden')}
function renderReview(resource,plan){const actions=(plan.actions||[]).map(x=>`<li>${esc(t(`plan.${x}`))}</li>`).join('');const safety=plan.destructive?`<span class="warning">${esc(t('plan.destructive'))}</span>`:esc(t('plan.nondestructive'));$('review').innerHTML=`<div class="review-row"><span>${esc(t('table.type'))}</span><b>${esc(t(`type.${resource.type}`))}</b></div><div class="review-row"><span>${esc(t('table.name'))}</span><b>${esc(resource.name)}</b></div><div class="review-row"><span>${esc(t('table.target'))}</span><span>${esc(resource.type==='pve_nfs'?resource.export:resource.target_iqn+' / LUN '+resource.lun)}</span></div><div class="review-row"><span>${esc(t('review.operations'))}</span><ul>${actions}</ul></div><div class="review-row"><span>${esc(t('review.safety'))}</span><span>${safety}</span></div>${(plan.blockers||[]).length?`<div class="error">${plan.blockers.map(x=>esc(t(x))).join('<br>')}</div>`:''}`;$('review').classList.remove('hidden');form.classList.add('hidden');$('step-definition').classList.remove('active');$('step-review').classList.add('active');$('wizard-next').classList.add('hidden');$('wizard-back').classList.remove('hidden');$('wizard-save').classList.remove('hidden')}
async function review(){try{if(!form.reportValidity())return;const resource=payload();currentPlan=await api('plan',{method:'POST',body:JSON.stringify(resource)});renderReview(resource,currentPlan)}catch(e){showError(e)}}async function saveDefinition(){try{await api('resources',{method:'POST',body:JSON.stringify(payload())});notify(t('message.saved'));closeWizard();await load()}catch(e){showError(e)}}async function removeResource(id){if(!confirm(t('confirm.delete')))return;try{await api(`resources?id=${encodeURIComponent(id)}`,{method:'DELETE'});notify(t('message.deleted'));await load()}catch(e){notify(t(e.message),'err')}}
function renderRows(){const body=$('rows');body.textContent='';for(const item of registry){const target=item.type==='pve_nfs'?item.export:`${item.target_iqn} / LUN ${item.lun}`;const row=document.createElement('tr');row.innerHTML=`<td>${esc(item.name)}</td><td>${esc(item.location)}</td><td>${esc(item.host)}</td><td>${esc(t(`type.${item.type}`))}</td><td>${esc(target)}</td><td><span class="pill">${esc(t('state.configured'))}</span></td><td class="row-actions"><button data-edit="${esc(item.id)}">${esc(t('action.edit'))}</button><button class="danger" data-delete="${esc(item.id)}">${esc(t('action.delete'))}</button></td>`;body.appendChild(row)}body.querySelectorAll('[data-edit]').forEach(b=>{b.disabled=!canManage;b.onclick=()=>{const item=registry.find(x=>x.id===b.dataset.edit);openWizard(item.type,item)}});body.querySelectorAll('[data-delete]').forEach(b=>{b.disabled=!canManage;b.onclick=()=>removeResource(b.dataset.delete)});$('empty').hidden=registry.length>0}
async function load(){try{const[status,data]=await Promise.all([api('status'),api('resources')]);canManage=Boolean(status.can_manage);registry=data.resources||[];$('metric-all').textContent=status.resources;$('metric-nfs').textContent=status.pve_nfs;$('metric-iscsi').textContent=status.pbs_iscsi;$('add-nfs').disabled=!canManage;$('add-iscsi').disabled=!canManage;renderRows()}catch(e){$('empty').hidden=false;$('empty').textContent=t(e.message||'error.load')}}
applyTheme();$('lang').value=localStorage.getItem('storage-assistant.lang')||((navigator.language||'en').startsWith('pl')?'pl':'en');$('lang').onchange=()=>setLanguage($('lang').value).then(renderRows).catch(e=>notify(String(e),'err'));$('refresh').onclick=load;$('add-nfs').onclick=()=>openWizard('pve_nfs');$('add-iscsi').onclick=()=>openWizard('pbs_iscsi');$('wizard-x').onclick=closeWizard;$('wizard-cancel').onclick=closeWizard;$('wizard-back').onclick=showDefinition;$('wizard-next').onclick=review;$('wizard-save').onclick=saveDefinition;$('wizard').onclick=e=>{if(e.target===$('wizard'))closeWizard()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeWizard()});setLanguage($('lang').value).then(load).catch(e=>notify(String(e),'err'));
</script>
</body></html>
